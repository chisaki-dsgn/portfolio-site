    <main class="p-contact l-main">
        <div class="l-inner">
            <h1 class="p-contact__title c-page-title">CONTACT</h1>
            <form action="https://ssgform.com/s/2C4DYj42idB1" method="post" class="p-contact__form">
                <h2 class="p-contact__form-title">お問い合わせフォーム</h2>
                <div class="p-contact__form-item">
                    <label for="user-name">お名前</label>
                    <input type="text" id="user-name" name="user-name" required>
                </div>
                <div class="p-contact__form-item">
                    <label for="user-group">会社名/団体名（任意）</label>
                    <input type="text" id="user-group" name="user-group">
                </div>
                <div class="p-contact__form-item">
                    <label for="user-email">メールアドレス</label>
                    <input type="email" id="user-email" name="email" required>
                </div>
                <div class="p-contact__form-item">
                    <label for="user-text">お問い合わせ内容</label>
                    <textarea name="user-text" id="user-text" required></textarea>
                </div>
                <div class="p-contact__privacy-check">
                    <input type="checkbox" id="privacy" required>
                    <label for="privacy">
                        <a href="/page-privacy.html" target="_blank">プライバシーポリシー</a>に同意する
                    </label>
                </div>
                <button type="submit" class="p-contact__form-btn  c-btn-contact" data-gtm-click="submit">送信する</button>
                <p class="p-contact__form-note">
                    <small>※通常2～3営業日以内にご連絡いたします。</small>
                    <small>※1週間経過しても返信がない場合、迷惑メールフォルダをご確認いただくか、DMにてご連絡ください。</small>
                </p>
            </form>
            <p class="p-contact__note">フォーム以外からのお問い合わせは<br>ページ下部記載SNSのDMにて<br>お気軽にご連絡ください</p>
        </div>
    </main>
